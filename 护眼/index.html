<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>护眼程序</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 动画区域 -->
    <div id="animation-area">
        <!-- 移动点将在此区域显示 -->
        <canvas id="eye-canvas" width="600" height="400"></canvas>
    </div>
    <!-- 护眼计时区域 -->
    <div id="timer-area" style="text-align:center;margin:18px 0 8px 0;">
        <span id="timer-display" style="font-size:1.3em;color:#145A32;font-weight:bold;">护眼时长：00:00:00</span>
        <button id="timer-btn" style="margin-left:18px;font-size:1em;padding:4px 18px;background:#4caf50;color:#fff;border:none;border-radius:4px;cursor:pointer;">开始计时</button>
    </div>
    <!-- 护眼时长统计框 -->
    <div id="eye-stats-box" style="position:fixed;left:18px;bottom:18px;z-index:9999;background:#fff;border:2px solid #4caf50;border-radius:10px;box-shadow:0 2px 8px #0001;padding:12px 18px;min-width:180px;max-width:320px;transition:all 0.2s;">
        <div id="eye-stats-header" style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;">
            <span style="color:#145A32;font-weight:bold;">护眼统计</span>
            <button id="eye-stats-toggle" style="background:none;border:none;font-size:18px;cursor:pointer;color:#4caf50;">－</button>
        </div>
        <div id="eye-stats-content" style="margin-top:8px;"></div>
    </div>
    <!-- 参数设置区域 -->
    <div id="settings-toggle" title="设置">
        <!-- 齿轮SVG图标 -->
        <svg width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="#fff"/><path d="M16 11a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0-7a2 2 0 0 1 2 2v1.09a9.03 9.03 0 0 1 2.36.98l.77-.77a2 2 0 1 1 2.83 2.83l-.77.77c.39.74.7 1.54.98 2.36H26a2 2 0 1 1 0 4h-1.09a9.03 9.03 0 0 1-.98 2.36l.77.77a2 2 0 1 1-2.83 2.83l-.77-.77a9.03 9.03 0 0 1-2.36.98V26a2 2 0 1 1-4 0v-1.09a9.03 9.03 0 0 1-2.36-.98l-.77.77a2 2 0 1 1-2.83-2.83l.77-.77a9.03 9.03 0 0 1-.98-2.36H6a2 2 0 1 1 0-4h1.09a9.03 9.03 0 0 1 .98-2.36l-.77-.77a2 2 0 1 1 2.83-2.83l.77.77a9.03 9.03 0 0 1 2.36-.98V6a2 2 0 0 1 2-2z" fill="#145A32"/></svg>
    </div>
    <div id="settings-area" style="display:none;">
        <button id="settings-close" title="关闭设置" style="float:right;font-size:20px;background:none;border:none;cursor:pointer;">×</button>
        <label for="speed-range">移动速度：</label>
        <input type="range" id="speed-range" min="0.5" max="5" step="0.1" value="2">
        <span id="speed-value">2</span>
        <br>
        <label for="path-select">轨迹类型：</label>
        <select id="path-select">
            <option value="circle">圆形</option>
            <option value="eight">八字形</option>
            <option value="random">随机</option>
        </select>
        <label for="size-range">点的大小：</label>
        <input type="range" id="size-range" min="8" max="80" step="1" value="24">
        <span id="size-value">24</span>
        <br>
        <label for="mode-select">训练模式：</label>
        <select id="mode-select">
            <option value="single">单点跟随</option>
            <option value="multi">多点跟随</option>
            <option value="eight">八字形轨迹</option>
            <option value="nearfar">远近交替</option>
        </select>
        <br>
        <div id="multi-settings" style="display:none;">
            <label for="multi-count">点数量：</label>
            <input type="number" id="multi-count" min="2" max="8" value="3" style="width:48px;">
            <br>
        </div>
        <div id="nearfar-settings" style="display:none;">
            <label for="nearfar-interval">交替间隔(秒)：</label>
            <input type="number" id="nearfar-interval" min="1" max="10" value="2" style="width:48px;">
            <br>
        </div>
    </div>
    <!-- 数据统计区域 -->
    <div id="stats-area">
        <!-- 后续添加统计数据展示 -->
    </div>
    <script src="main.js"></script>
</body>
</html>
